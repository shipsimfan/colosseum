[workspace.package]
version = "0.6.4"
authors = ["Lance Hart <me@lancehart.ca>"]
edition = "2024"
repository = "https://github.com/shipsimfan/colosseum"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
colosseum-build.path = "build"
colosseum-macros.path = "macros"

alexandria = { git = "https://github.com/shipsimfan/alexandria", features = [
    "data-format",
] }

argparse.git = "https://github.com/shipsimfan/lib-argparse"
data-format.git = "https://github.com/shipsimfan/lib-data-format"
json.git = "https://github.com/shipsimfan/lib-json"
time.git = "https://github.com/shipsimfan/lib-time"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev-release]
inherits = "dev"
opt-level = 3
lto = "fat"
codegen-units = 1

[package]
name = "colosseum"
description = "Cross-Platform, Multi-threaded Vulkan Game Engine"

version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
colosseum-macros.workspace = true

alexandria.workspace = true

argparse.workspace = true
data-format.workspace = true
json.workspace = true
time.workspace = true

[build-dependencies]
colosseum-build.workspace = true
